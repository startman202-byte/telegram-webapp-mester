<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Premium Bot UI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#fff7f8;
      --card:#ffffff;
      --red:#ff5c72;
      --red2:#ff7f91;
      --red3:#ffe3e7;
      --text:#2b2023;
      --muted:#8a6d72;
      --shadow:0 10px 30px rgba(255,92,114,.13);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,"Noto Sans Arabic",sans-serif;
      background:
        radial-gradient(circle at 10% 0%,#ffdce2 0,transparent 32%),
        radial-gradient(circle at 100% 20%,#ffecef 0,transparent 35%),
        var(--bg);
      color:var(--text);
    }
    .wrap{max-width:560px;margin:auto;padding:18px 16px 28px}
    .hero{
      background:linear-gradient(135deg,#ff5069,#ff8a99);
      color:#fff;border-radius:28px;padding:22px 20px;
      box-shadow:0 18px 38px rgba(255,80,105,.25);
      position:relative;overflow:hidden;margin-bottom:18px
    }
    .hero:after{
      content:"";position:absolute;width:180px;height:180px;border-radius:50%;
      background:rgba(255,255,255,.12);left:-65px;top:-70px
    }
    .hero h1{margin:0 0 7px;font-size:25px}
    .hero p{margin:0;opacity:.9;font-size:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    button{
      border:0;width:100%;min-height:74px;border-radius:20px;
      background:linear-gradient(145deg,#ff6b7e,#ff8a99);
      color:#fff;font-size:16px;font-weight:700;
      box-shadow:var(--shadow);
      cursor:pointer;transition:.16s transform,.16s box-shadow;
      padding:12px
    }
    button:active{transform:scale(.96);box-shadow:0 5px 15px rgba(255,92,114,.12)}
    .wide{grid-column:1/-1}
    .icon{display:block;font-size:25px;margin-bottom:6px}
    .sub{
      margin-top:18px;background:rgba(255,255,255,.78);
      border:1px solid #ffe1e5;border-radius:22px;padding:15px;
      color:var(--muted);font-size:13px;text-align:center
    }
    .back{background:#fff;color:var(--red);border:1px solid #ffd5db}
    .screen{display:none}.screen.active{display:block}
    .title{font-size:21px;font-weight:800;margin:6px 2px 15px}
    .pkg{margin-bottom:10px;min-height:62px}
  </style>
</head>
<body>
<div class="wrap">
  <section id="home" class="screen active">
    <div class="hero">
      <h1>🔥 الواجهة الفخمة</h1>
      <p>كل خدمات البوت في مكان واحد — بشكل أسرع وأشيك.</p>
    </div>
    <div class="grid">
      <button onclick="send('balance')"><span class="icon">💰</span>رصيدي</button>
      <button onclick="send('recharge')"><span class="icon">💳</span>شحن لينكات</button>
      <button onclick="send('bybit')"><span class="icon">🟣</span>دفع Bybit</button>
      <button onclick="send('binance')"><span class="icon">🔵</span>دفع Binance</button>
      <button onclick="send('account')"><span class="icon">📊</span>حسابي</button>
      <button onclick="send('support')"><span class="icon">🎧</span>الدعم</button>
      <button onclick="send('commands')"><span class="icon">📋</span>الأوامر</button>
      <button onclick="send('language')"><span class="icon">🌐</span>اللغة</button>
    </div>
    <div class="sub">🩷 تصميم أحمر فاتح + تأثيرات ضغط خفيفة + واجهة متجاوبة للموبايل</div>
  </section>

  <section id="packages" class="screen">
    <div class="title">💳 باقات الشحن</div>
    <button class="pkg" onclick="send('recharge')">🎁 فتح باقات الشحن داخل البوت</button>
    <button class="back" onclick="goHome()">↩️ رجوع</button>
  </section>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#ff5c72'); tg.setBackgroundColor('#fff7f8'); } catch(e) {}
  }
  function send(action){
    if(!tg){
      alert('افتح الواجهة من داخل Telegram');
      return;
    }
    tg.sendData(JSON.stringify({action}));
    setTimeout(()=>tg.close(),120);
  }
  function goHome(){
    document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
    document.getElementById('home').classList.add('active');
  }
</script>
</body>
</html>
